<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="JTGen - Jira Ticket Generator" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Cache busting - Force hard refresh -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Last-Modified" content="0" />
    <meta name="cache-bust" content="2025-10-09-local-app-fix-v2" />
    <script>
      // Force cache busting and clear service worker
      console.log('🔄 CACHE BUSTING: Forcing fresh load at', new Date().toISOString());
      console.log('🌐 Current URL:', window.location.href);
      console.log('🏠 Hostname:', window.location.hostname);
      console.log('🔌 Port:', window.location.port);
      console.log('🌐 Protocol:', window.location.protocol);
      
      // Unregister all service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('🔄 Unregistered service worker');
          }
        });
      }
    </script>
    
    <title>JTGen Web</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
