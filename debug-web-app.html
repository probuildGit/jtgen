<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug { background-color: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .error { background-color: #ffebee; border-left: 4px solid #f44336; }
        .success { background-color: #e8f5e8; border-left: 4px solid #4caf50; }
        .warning { background-color: #fff3e0; border-left: 4px solid #ff9800; }
    </style>
</head>
<body>
    <h1>🔍 Web App Debug</h1>
    
    <div id="debug-results"></div>
    
    <script>
        async function debugWebApp() {
            const results = document.getElementById('debug-results');
            
            try {
                // Test 1: Check if we can access the web app
                const response = await fetch('https://probuildgit.github.io/jtgen/');
                const html = await response.text();
                
                results.innerHTML += `
                    <div class="success">
                        <h3>✅ Web App Access</h3>
                        <p>Successfully loaded web app HTML (${html.length} characters)</p>
                    </div>
                `;
                
                // Test 2: Check for Settings button in HTML
                const hasSettingsButton = html.includes('Settings') || html.includes('⚙') || html.includes('settings');
                
                results.innerHTML += `
                    <div class="${hasSettingsButton ? 'success' : 'warning'}">
                        <h3>🔍 Settings Button Check</h3>
                        <p>Settings button found in HTML: ${hasSettingsButton ? '✅ Yes' : '❌ No'}</p>
                    </div>
                `;
                
                // Test 3: Check for main JavaScript file
                const mainJsMatch = html.match(/main\.[a-f0-9]+\.js/);
                if (mainJsMatch) {
                    const mainJsFile = mainJsMatch[0];
                    results.innerHTML += `
                        <div class="success">
                            <h3>📦 Main JavaScript File</h3>
                            <p>Found: ${mainJsFile}</p>
                        </div>
                    `;
                    
                    // Test 4: Check the main JavaScript file content
                    try {
                        const jsResponse = await fetch(`https://probuildgit.github.io/jtgen/static/js/${mainJsFile}`);
                        const jsContent = await jsResponse.text();
                        
                        const hasSettingsButtonInJs = jsContent.includes('SettingsButton') || jsContent.includes('Settings');
                        const hasAppWeb = jsContent.includes('App.web.js') || jsContent.includes('App.web');
                        const hasAppLocal = jsContent.includes('App.local.js') || jsContent.includes('App.local');
                        
                        results.innerHTML += `
                            <div class="${hasSettingsButtonInJs ? 'success' : 'warning'}">
                                <h3>🔍 JavaScript Content Check</h3>
                                <p>SettingsButton in JS: ${hasSettingsButtonInJs ? '✅ Yes' : '❌ No'}</p>
                                <p>App.web.js in JS: ${hasAppWeb ? '✅ Yes' : '❌ No'}</p>
                                <p>App.local.js in JS: ${hasAppLocal ? '✅ Yes' : '❌ No'}</p>
                            </div>
                        `;
                        
                    } catch (jsError) {
                        results.innerHTML += `
                            <div class="error">
                                <h3>❌ JavaScript File Error</h3>
                                <p>Could not load main JavaScript file: ${jsError.message}</p>
                            </div>
                        `;
                    }
                }
                
                // Test 5: Environment detection simulation
                const hostname = 'probuildgit.github.io';
                const protocol = 'https:';
                const isLocal = hostname === 'localhost' || hostname === '127.0.0.1' || protocol === 'http:';
                const isWeb = hostname === 'probuildgit.github.io' || hostname.includes('github.io') || protocol === 'https:';
                
                results.innerHTML += `
                    <div class="${isWeb ? 'success' : 'error'}">
                        <h3>🌐 Environment Detection Simulation</h3>
                        <p>Hostname: ${hostname}</p>
                        <p>Protocol: ${protocol}</p>
                        <p>Should be Web Environment: ${isWeb ? '✅ Yes' : '❌ No'}</p>
                        <p>Should be Local Environment: ${isLocal ? '✅ Yes' : '❌ No'}</p>
                    </div>
                `;
                
            } catch (error) {
                results.innerHTML += `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>Could not debug web app: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Run the debug
        debugWebApp();
    </script>
</body>
</html>
